<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adedonha Treino</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071735, #102b63);
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 30px 15px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: #cbd6ff;
      margin-bottom: 25px;
    }

    .painel {
      max-width: 1000px;
      margin: auto;
    }

    .letra {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: white;
      color: #071735;
      font-size: 70px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto 10px;
    }

    .timer {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .botoes {
      margin: 20px 0;
    }

    button, select {
      padding: 12px 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button {
      background: #ffffff;
      color: #071735;
    }

    button:hover {
      background: #dce6ff;
    }

    .botao-principal {
      background: #19d36b;
      color: white;
    }

    .botao-alerta {
      background: #d31035;
      color: white;
    }

    .categorias {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 850px;
      margin: 30px auto;
    }

    .campo {
      text-align: left;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 10px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .status {
      margin-top: 6px;
      font-size: 14px;
      min-height: 20px;
    }

    .correto {
      color: #5eff9b;
    }

    .errado {
      color: #ff8d8d;
    }

    .sugestao {
      color: #ffe56b;
    }

    .resultado {
      max-width: 850px;
      margin: 25px auto;
      background: rgba(255, 255, 255, 0.12);
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      display: none;
    }

    .resultado h2 {
      text-align: center;
      margin-top: 0;
    }

    .metricas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .metrica {
      background: rgba(255, 255, 255, 0.12);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .metrica strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .categorias, .metricas {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="painel">
    <h1>Adedonha Treino</h1>
    <p class="subtitulo">Treine com tempo normal, tempo lento, pausa e avaliação de desempenho.</p>

    <div class="letra" id="letra">?</div>
    <div class="timer" id="timer">60</div>

    <div>
      <select id="modoTempo">
        <option value="120">Modo estudo - 120s</option>
        <option value="60" selected>Modo normal - 60s</option>
        <option value="30">Modo desafio - 30s</option>
      </select>
    </div>

    <div class="botoes">
      <button onclick="novaRodada()" class="botao-principal">Nova rodada</button>
      <button onclick="iniciarTempo()">Iniciar</button>
      <button onclick="pausarTempo()">Pausar</button>
      <button onclick="continuarTempo()">Continuar</button>
      <button onclick="tempoLento()">Tempo lento</button>
      <button onclick="semTempo()">Sem tempo</button>
      <button onclick="avaliar()" class="botao-alerta">Avaliar desempenho</button>
    </div>

    <div class="categorias" id="categorias"></div>

    <div class="resultado" id="resultado"></div>
  </div>

        D: ["Dog", "Data"],

        H: ["House", "Heart"],
        I: ["Image", "Internet"],

        L: ["Love", "Light"],

        P: ["People", "Phone"],
        S: ["School", "Sun"],

    const todasCategorias = Object.keys(banco);

    function removerAcentos(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function sortearLetra() {
      const letrasValidas = "ABCDEFGHIJKLMNOPRSTUV".split("");
      letraAtual = letrasValidas[Math.floor(Math.random() * letrasValidas.length)];
      document.getElementById("letra").textContent = letraAtual;
    }

    function sortearCategorias() {
      const embaralhadas = [...todasCategorias].sort(() => Math.random() - 0.5);
      categoriasDaRodada = embaralhadas.slice(0, 10);
      const area = document.getElementById("categorias");
      area.innerHTML = "";

      categoriasDaRodada.forEach((categoria, index) => {
        area.innerHTML += `
          <div class="campo">
            <label>${categoria}</label>
            <input id="resposta-${index}" type="text" autocomplete="off">
            <div class="status" id="status-${index}"></div>
          </div>
        `;
      });
    }

    function novaRodada() {
      clearInterval(intervalo);
      document.getElementById("resultado").style.display = "none";
      semLimiteDeTempo = false;
      velocidade = 1000;
      tempoTotal = Number(document.getElementById("modoTempo").value);
      tempoRestante = tempoTotal;
      document.getElementById("timer").textContent = tempoRestante;
      sortearLetra();
      sortearCategorias();
    }

    function iniciarTempo() {
      clearInterval(intervalo);
      semLimiteDeTempo = false;
      tempoTotal = Number(document.getElementById("modoTempo").value);
      tempoRestante = tempoTotal;
      velocidade = 1000;
      document.getElementById("timer").textContent = tempoRestante;
      rodarTempo();
    }

    function rodarTempo() {
      clearInterval(intervalo);
      intervalo = setInterval(() => {
        tempoRestante--;
        document.getElementById("timer").textContent = tempoRestante;

        if (tempoRestante <= 0) {
          clearInterval(intervalo);
          avaliar();
          alert("Tempo acabou! Seu desempenho foi avaliado.");
        }
      }, velocidade);
    }

    function pausarTempo() {
      clearInterval(intervalo);
    }

    function continuarTempo() {
      if (!semLimiteDeTempo && tempoRestante > 0) {
        rodarTempo();
      }
    }

    function tempoLento() {
      velocidade = 2500;
      if (!semLimiteDeTempo && tempoRestante > 0) {
        rodarTempo();
      }
    }

    function semTempo() {
      clearInterval(intervalo);
      semLimiteDeTempo = true;
      document.getElementById("timer").textContent = "Sem tempo";
    }

    function avaliar() {
      clearInterval(intervalo);

      let corretas = 0;
      let preenchidas = 0;
      let invalidas = 0;
      let emBranco = 0;

      categoriasDaRodada.forEach((categoria, index) => {
        const input = document.getElementById(`resposta-${index}`);
        const status = document.getElementById(`status-${index}`);
        const resposta = input.value.trim();

        const respostasValidas = banco[categoria][letraAtual] || [];
        const respostasNormalizadas = respostasValidas.map(r => removerAcentos(r));

        status.innerHTML = "";
        status.className = "status";

        if (resposta === "") {
          emBranco++;
          const sugestao = respostasValidas[0];

          if (sugestao) {
            input.value = sugestao;
            status.innerHTML = `Sugestão: ${sugestao}`;
            status.classList.add("sugestao");
          } else {
            status.innerHTML = "Sem sugestão cadastrada para esta letra.";
            status.classList.add("errado");
          }
          return;
        }

        preenchidas++;

        if (respostasNormalizadas.includes(removerAcentos(resposta))) {
          corretas++;
          status.innerHTML = "Resposta válida.";
          status.classList.add("correto");
        } else {
          invalidas++;
          const sugestoes = respostasValidas.slice(0, 3).join(", ");
          status.innerHTML = sugestoes
            ? `Não encontrei no banco. Sugestões: ${sugestoes}`
            : "Não encontrei resposta cadastrada para esta categoria/letra.";
          status.classList.add("errado");
        }
      });

      const total = categoriasDaRodada.length;
      const eficacia = Math.round((corretas / total) * 100);

      let tempoUsado;
      if (semLimiteDeTempo) {
        tempoUsado = "sem limite";
      } else {
        tempoUsado = tempoTotal - tempoRestante;
      }

      let eficiencia;
      if (semLimiteDeTempo) {
        eficiencia = "modo treino";
      } else {
        eficiencia = Math.round(((tempoTotal - tempoRestante) / tempoTotal) * 100) + "% do tempo usado";
      }

      let produtividade;
      if (semLimiteDeTempo) {
        produtividade = `${corretas} respostas válidas`;
      } else {
        const minutos = Math.max((tempoTotal - tempoRestante) / 60, 0.1);
        produtividade = (corretas / minutos).toFixed(1) + " respostas válidas/min";
      }

      let mensagem = "";

      if (eficacia >= 80) {
        mensagem = "Muito bom! Você conseguiu preencher a maior parte das categorias corretamente.";
      } else if (eficacia >= 50) {
        mensagem = "Bom treino. Você teve um desempenho intermediário e pode melhorar com prática.";
      } else {
        mensagem = "Você ainda está em fase de aquecimento. Use as sugestões para criar memória de respostas.";
      }

      document.getElementById("resultado").style.display = "block";
      document.getElementById("resultado").innerHTML = `
        <h2>Relatório de desempenho</h2>

        <div class="metricas">
          <div class="metrica">
            Eficácia
            <strong>${eficacia}%</strong>
          </div>

          <div class="metrica">
            Eficiência
            <strong>${eficiencia}</strong>
          </div>

          <div class="metrica">
            Produtividade
            <strong>${produtividade}</strong>
          </div>
        </div>

        <p><strong>Respostas corretas:</strong> ${corretas}/${total}</p>
        <p><strong>Respostas preenchidas:</strong> ${preenchidas}</p>
        <p><strong>Respostas inválidas ou não cadastradas:</strong> ${invalidas}</p>
        <p><strong>Campos em branco:</strong> ${emBranco}</p>
        <p><strong>Tempo usado:</strong> ${tempoUsado}</p>
        <p><strong>Análise:</strong> ${mensagem}</p>

        <p><em>Observação: a validação depende do banco de respostas cadastrado. Se uma resposta sua estiver certa, mas não estiver no banco, o site pode marcar como não encontrada.</em></p>
      `;
    }

    novaRodada();
  </script>
</body>
</html>
