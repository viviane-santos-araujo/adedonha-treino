<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adedonha Treino</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071735,#102b63);
  color:white;
  min-height:100vh;
  text-align:center;
  padding:25px 15px;
}
h1{font-size:42px;margin-bottom:5px}
.subtitulo{color:#cbd6ff}
.letra{
  width:110px;height:110px;border-radius:50%;
  background:white;color:#071735;
  font-size:68px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  margin:20px auto 8px;
}
.timer{font-size:36px;margin-bottom:15px}
button,select{
  padding:11px 14px;margin:5px;
  border:none;border-radius:8px;
  font-weight:bold;cursor:pointer;
}
button{background:white;color:#071735}
.verde{background:#19d36b;color:white}
.vermelho{background:#d31035;color:white}
.categorias{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-width:900px;
  margin:25px auto;
}
.campo{
  text-align:left;
  background:rgba(255,255,255,.09);
  padding:12px;
  border-radius:10px;
}
label{font-weight:bold;display:block;margin-bottom:6px}
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
.status{margin-top:7px;font-size:14px;min-height:20px}
.confirmada{color:#5eff9b}
.revisar{color:#ffe56b}
.errada{color:#ff8d8d}
.sugestao{color:#9ee8ff}
.resultado{
  display:none;
  max-width:900px;
  margin:25px auto;
  background:rgba(255,255,255,.13);
  padding:20px;
  border-radius:12px;
  text-align:left;
}
.resultado h2{text-align:center;margin-top:0}
.metricas{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.metrica{
  background:rgba(255,255,255,.13);
  padding:15px;
  border-radius:10px;
  text-align:center;
}
.metrica strong{
  display:block;
  font-size:26px;
  margin-top:8px;
}
@media(max-width:700px){
  .categorias,.metricas{grid-template-columns:1fr}
  h1{font-size:32px}
}
</style>
</head>

<body>

<h1>Adedonha Treino</h1>
<p class="subtitulo">Agora com respostas confirmadas, respostas para revisar e inválidas reais.</p>

<div class="letra" id="letra">?</div>
<div class="timer" id="timer">60</div>

<select id="modoTempo">
  <option value="120">Modo estudo - 120s</option>
  <option value="60" selected>Modo normal - 60s</option>
  <option value="30">Modo desafio - 30s</option>
</select>

<div>
  <button class="verde" onclick="novaRodada()">Nova rodada</button>
  <button onclick="iniciarTempo()">Iniciar</button>
  <button onclick="pausarTempo()">Pausar</button>
  <button onclick="continuarTempo()">Continuar</button>
  <button onclick="tempoLento()">Tempo lento</button>
  <button onclick="semTempo()">Sem tempo</button>
  <button class="vermelho" onclick="avaliar()">Avaliar desempenho</button>
</div>

<div class="categorias" id="categorias"></div>

<div class="resultado" id="resultado"></div>

<script>
let letraAtual = "";
let tempoTotal = 60;
let tempoRestante = 60;
let intervalo = null;
let velocidade = 1000;
let categoriasDaRodada = [];
let semLimiteDeTempo = false;

const banco = {
  "Nome feminino": {
    A:["Ana","Amanda","Alice","Aline"], B:["Bianca","Bruna","Beatriz"],
    C:["Camila","Carla","Clara","Cecília"], F:["Fernanda","Fabiana","Flávia"],
    J:["Joana","Juliana","Jéssica"], L:["Larissa","Luana","Lívia"],
    M:["Maria","Mariana","Marta"], P:["Patrícia","Paula","Priscila"],
    S:["Sara","Samara","Sofia","Simone"], V:["Viviane","Vitória","Vanessa"]
  },
  "Nome masculino": {
    A:["André","Arthur","Antônio"], C:["Carlos","Caio","César"],
    F:["Fernando","Felipe","Fábio"], J:["João","José","Júlio"],
    L:["Lucas","Luís","Leonardo"], M:["Marcos","Miguel","Mateus"],
    P:["Pedro","Paulo","Pablo"], R:["Rafael","Ricardo","Renan"],
    S:["Samuel","Samir","Sandro","Sérgio"]
  },
  "País": {
    A:["Argentina","Angola","Austrália"], B:["Brasil","Bolívia","Bélgica"],
    C:["Canadá","Chile","China","Coreia do Sul","Coreia do Norte","Colômbia"],
    F:["Finlândia","França","Filipinas"], J:["Japão","Jamaica","Jordânia"],
    P:["Portugal","Paraguai","Peru","Polônia","Panamá"],
    S:["Suíça","Suécia","Senegal"]
  },
  "Animal": {
    A:["Arara","Anta","Abelha"], C:["Cachorro","Cavalo","Cobra"],
    F:["Formiga","Foca","Flamingo"], J:["Jiboia","Jacaré","Javali"],
    L:["Leão","Lobo","Lagarto"], P:["Pato","Porco","Pinguim"],
    S:["Sapo","Serpente","Suricato","Sucuri"]
  },
  "Comida": {
    A:["Arroz","Acarajé","Abacate"], C:["Cuscuz","Carne","Chocolate","Caqui"],
    F:["Farofa","Feijão","Frango","Fruta"], J:["Jaca","Jiló"],
    L:["Lasanha","Laranja","Lentilha"],
    P:["Pizza","Pudim","Pão","Pistache","Pipoca","Peixe","Pastel"],
    S:["Sopa","Sorvete","Salada"]
  },
  "Objeto": {
    C:["Caneta","Cadeira","Copo"], F:["Fichário","Fone","Faca","Fogão"],
    J:["Janela","Jarro"], L:["Lápis","Livro","Lanterna"],
    P:["Pente","Prato","Panela","Pneu","Papel","Porta"],
    S:["Sapato","Sabonete"]
  },
  "Vestuário": {
    C:["Calça","Camisa","Casaco"], F:["Faixa","Fantasia","Farda"],
    J:["Jaqueta","Jaleco"], L:["Luva","Lenço"],
    P:["Pijama","Pulseira","Paletó"], S:["Saia","Sandália","Short","Sapato"]
  },
  "Profissão": {
    A:["Advogado","Analista","Arquiteto"], C:["Contador","Cozinheiro","Cantor"],
    F:["Fotógrafo","Farmacêutico","Faxineiro"], J:["Jardineiro","Jornalista","Juiz"],
    P:["Professor","Programador","Padeiro"], S:["Soldador","Secretária","Sapateiro"]
  },
  "App ou site": {
    C:["Canva","ChatGPT"], G:["Google","Gmail"], I:["Instagram","iFood"],
    L:["LinkedIn"], P:["Pinterest","Prime Video"], S:["Spotify","Shein"],
    W:["WhatsApp","Wikipedia"], Y:["YouTube"]
  },
  "Ferramenta da Qualidade": {
    B:["Brainstorming"], C:["Check-list","Ciclo PDCA"],
    D:["Diagrama de Ishikawa"], F:["Fluxograma","Folha de verificação"],
    H:["Histograma"], M:["Matriz GUT"], P:["PDCA","Pareto","Plano de ação"],
    Q:["5W2H"], S:["5S"]
  },
  "Tema SENAI": {
    A:["Aprendizagem","Análise de Dados"], C:["Curso","Competência","Comunicação empresarial"],
    E:["Excel","Eficiência","Eficácia"], F:["Fluxograma","Ferramentas","Formação"],
    G:["Gestão"], I:["Indicadores","Indústria"],
    P:["Produtividade","Processo","PDCA","Plataforma Inovação","Produção"],
    Q:["Qualidade"], S:["SENAI","Sustentabilidade","Sistemas"],
    T:["Tecnologia","Treinamento"]
  },
  "Palavra em inglês": {
    A:["Apple","Animal"], B:["Book","Blue"], C:["Car","Cloud","Computer","Cat"],
    D:["Dog","Data"], F:["Far","Friend","Food","Fire"],
    L:["Love","Light"], M:["Music","Money"],
    P:["People","Phone","Police","Power","Paper"],
    S:["School","Sun","System"], T:["Time","Tree"], W:["Water","Work"]
  }
};

const todasCategorias = Object.keys(banco);

function normalizar(txt){
  return txt.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function comecaComLetraCerta(resp){
  return normalizar(resp).startsWith(normalizar(letraAtual));
}

function temTamanhoMinimo(resp){
  return normalizar(resp).length >= 2;
}

function sortearLetra(){
  const letrasValidas = "ABCDEFGHIJKLMNOPRSTUV".split("");
  letraAtual = letrasValidas[Math.floor(Math.random()*letrasValidas.length)];
  document.getElementById("letra").textContent = letraAtual;
}

function sortearCategorias(){
  categoriasDaRodada = [...todasCategorias].sort(()=>Math.random()-.5).slice(0,10);
  const area = document.getElementById("categorias");
  area.innerHTML = "";

  categoriasDaRodada.forEach((cat,i)=>{
    area.innerHTML += `
      <div class="campo">
        <label>${cat}</label>
        <input id="resposta-${i}" type="text" autocomplete="off">
        <div class="status" id="status-${i}"></div>
      </div>
    `;
  });
}

function novaRodada(){
  clearInterval(intervalo);
  document.getElementById("resultado").style.display="none";
  semLimiteDeTempo=false;
  velocidade=1000;
  tempoTotal=Number(document.getElementById("modoTempo").value);
  tempoRestante=tempoTotal;
  document.getElementById("timer").textContent=tempoRestante;
  sortearLetra();
  sortearCategorias();
}

function iniciarTempo(){
  clearInterval(intervalo);
  semLimiteDeTempo=false;
  velocidade=1000;
  tempoTotal=Number(document.getElementById("modoTempo").value);
  tempoRestante=tempoTotal;
  document.getElementById("timer").textContent=tempoRestante;
  rodarTempo();
}

function rodarTempo(){
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    tempoRestante--;
    document.getElementById("timer").textContent=tempoRestante;
    if(tempoRestante<=0){
      clearInterval(intervalo);
      avaliar();
      alert("Tempo acabou! Seu desempenho foi avaliado.");
    }
  },velocidade);
}

function pausarTempo(){ clearInterval(intervalo); }

function continuarTempo(){
  if(!semLimiteDeTempo && tempoRestante>0) rodarTempo();
}

function tempoLento(){
  velocidade=2500;
  if(!semLimiteDeTempo && tempoRestante>0) rodarTempo();
}

function semTempo(){
  clearInterval(intervalo);
  semLimiteDeTempo=true;
  document.getElementById("timer").textContent="Sem tempo";
}

function avaliar(){
  clearInterval(intervalo);

  let confirmadas=0;
  let revisar=0;
  let invalidas=0;
  let emBranco=0;
  let preenchidas=0;

  categoriasDaRodada.forEach((cat,i)=>{
    const input=document.getElementById(`resposta-${i}`);
    const status=document.getElementById(`status-${i}`);
    const resp=input.value.trim();

    const validas = banco[cat][letraAtual] || [];
    const validasNorm = validas.map(normalizar);

    status.innerHTML="";
    status.className="status";

    if(resp===""){
      emBranco++;
      const sugestao = validas[0];

      if(sugestao){
        input.value = sugestao;
        status.innerHTML = `Sugestão preenchida: ${sugestao}`;
        status.className = "status sugestao";
      }else{
        status.innerHTML = "Campo em branco. Sem sugestão cadastrada.";
        status.className = "status errada";
      }
      return;
    }

    preenchidas++;

    if(validasNorm.includes(normalizar(resp))){
      confirmadas++;
      status.innerHTML="Confirmada: está no banco da categoria.";
      status.className="status confirmada";
      return;
    }

    if(!temTamanhoMinimo(resp)){
      invalidas++;
      status.innerHTML="Inválida: resposta curta demais.";
      status.className="status errada";
      return;
    }

    if(!comecaComLetraCerta(resp)){
      invalidas++;
      status.innerHTML=`Inválida: não começa com a letra ${letraAtual}.`;
      status.className="status errada";
      return;
    }

    revisar++;
    status.innerHTML="Para revisar: começa com a letra correta, mas não está no banco da categoria.";
    status.className="status revisar";
  });

  const total = categoriasDaRodada.length;
  const acertosConfirmados = confirmadas;
  const possiveisAcertos = confirmadas + revisar;
  const eficaciaConfirmada = Math.round((acertosConfirmados / total) * 100);
  const eficaciaPossivel = Math.round((possiveisAcertos / total) * 100);

  let tempoUsado, eficiencia, produtividade;

  if(semLimiteDeTempo){
    tempoUsado="sem limite";
    eficiencia="modo treino";
    produtividade=`${possiveisAcertos} respostas possíveis`;
  }else{
    tempoUsado = tempoTotal - tempoRestante;
    eficiencia = Math.round((tempoUsado / tempoTotal) * 100) + "% do tempo usado";
    const minutos = Math.max(tempoUsado / 60, 0.1);
    produtividade = (possiveisAcertos / minutos).toFixed(1) + " respostas possíveis/min";
  }

  document.getElementById("resultado").style.display="block";
  document.getElementById("resultado").innerHTML=`
    <h2>Relatório de desempenho</h2>

    <div class="metricas">
      <div class="metrica">Eficácia confirmada<strong>${eficaciaConfirmada}%</strong></div>
      <div class="metrica">Eficácia possível<strong>${eficaciaPossivel}%</strong></div>
      <div class="metrica">Produtividade<strong>${produtividade}</strong></div>
    </div>

    <p><strong>Confirmadas no banco:</strong> ${confirmadas}</p>
    <p><strong>Para revisar:</strong> ${revisar}</p>
    <p><strong>Inválidas reais:</strong> ${invalidas}</p>
    <p><strong>Campos em branco:</strong> ${emBranco}</p>
    <p><strong>Respostas preenchidas:</strong> ${preenchidas}</p>
    <p><strong>Tempo usado:</strong> ${tempoUsado}</p>
    <p><strong>Eficiência:</strong> ${eficiencia}</p>

    <p><em>Observação: “para revisar” significa que a palavra começa corretamente, mas o site não consegue garantir sozinho que pertence à categoria.</em></p>
  `;
}

novaRodada();
</script>

</body>
</html>
